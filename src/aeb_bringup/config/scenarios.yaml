# Euro NCAP-style car-to-car rear (CCR) scenarios. Speeds in km/h, gap in m.
CCRs_20: {type: stationary, ego_kmh: 20, target_kmh: 0,  gap_m: 80}
CCRs_30: {type: stationary, ego_kmh: 30, target_kmh: 0,  gap_m: 80}
CCRs_40: {type: stationary, ego_kmh: 40, target_kmh: 0,  gap_m: 80}
CCRs_50: {type: stationary, ego_kmh: 50, target_kmh: 0,  gap_m: 80}
CCRm_50_20: {type: moving,  ego_kmh: 50, target_kmh: 20, gap_m: 80, duration_s: 16}
CCRb_50_d2: {type: braking, ego_kmh: 50, target_kmh: 50, gap_m: 40, target_decel_mps2: 2.0, brake_after_s: 1.0}
CCRb_50_d6: {type: braking, ego_kmh: 50, target_kmh: 50, gap_m: 12, target_decel_mps2: 6.0, brake_after_s: 1.0}
# false-positive checks: no real threat, so the AEB must never command the brake
FP_none: {type: none, no_target: true, false_positive: true, ego_kmh: 50, gap_m: 0, road_m: 190, duration_s: 12}
FP_adjacent: {type: stationary, false_positive: true, ego_kmh: 50, target_kmh: 0, gap_m: 60, lateral_offset_m: 3.5, road_m: 140, duration_s: 8.5}
FP_follow: {type: moving, false_positive: true, ego_kmh: 50, target_kmh: 50, gap_m: 15, road_m: 190, duration_s: 12}
